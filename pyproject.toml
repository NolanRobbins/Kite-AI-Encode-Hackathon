[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "negotiatorgrid"
version = "0.1.0"
description = "Agent-to-agent price negotiation protocol on Kite AI blockchain"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Nolan Robbins" },
]

dependencies = [
    "negmas>=0.10.0",
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "typing_extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]
gambit = [
    "pygambit>=16.2.0",
]

[project.scripts]
negotiatorgrid-demo = "negotiatorgrid.demo:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
