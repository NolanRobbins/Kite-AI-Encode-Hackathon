# Local one-command stack for the NegotiatorGrid Day-4 demo.
#
# Launches three services:
#   - backend (FastAPI on :8000)
#   - surprise_api (x402 seller on :8801)
#   - dashboard (Next.js static export served by `next start`, :3000)
#
# Dashboard deploys to Vercel for the public demo; this compose is only
# the local/air-gapped fallback documented in the deployment plan §6.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: negotiatorgrid-backend
    ports:
      - "8000:8000"
    environment:
      - KITE_RPC_URL=${KITE_RPC_URL:-https://rpc-testnet.gokite.ai/}
      - KITE_CHAIN_ID=${KITE_CHAIN_ID:-2368}
      - X402_FACILITATOR_URL=${X402_FACILITATOR_URL:-https://facilitator.pieverse.io}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BUYER_PRIVATE_KEY=${BUYER_PRIVATE_KEY:-}
      - SELLER_PRIVATE_KEY=${SELLER_PRIVATE_KEY:-}
      - DEAL_RECORD_ADDRESS=${DEAL_RECORD_ADDRESS:-}
      - IDENTITY_REGISTRY_ADDRESS=${IDENTITY_REGISTRY_ADDRESS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  surprise_api:
    build:
      context: .
      dockerfile: surprise_api/Dockerfile
    container_name: negotiatorgrid-surprise-api
    ports:
      - "8801:8801"
    environment:
      - SURPRISE_API_SELLER_WALLET=${SURPRISE_API_SELLER_WALLET:-0xa7C52Bd9E51E6c49aB2F0aB30c57Bb24aB1B91B7}
      - KITE_NETWORK=${KITE_NETWORK:-eip155:2368}
      - TEST_USDT_ADDRESS=${TEST_USDT_ADDRESS:-0x0fF5393387ad2f9f691FD6Fd28e07E3969e27e63}
      - X402_FACILITATOR_URL=${X402_FACILITATOR_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8801/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: negotiatorgrid-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_SURPRISE_API_URL=http://localhost:8801
    depends_on:
      backend:
        condition: service_healthy
      surprise_api:
        condition: service_healthy
